# Выкладка сайта на хостинг Timeweb.
# Запускается сама при каждом изменении в ветке main, а ещё вручную: Actions → «Выложить сайт» → Run workflow.
# Логин и пароль хранятся в Settings → Secrets and variables → Actions (FTP_HOST, FTP_USER, FTP_PASSWORD), в коде их нет.
name: Выложить сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Собрать файлы сайта
        run: |
          mkdir site
          cp -r index.html img fonts favicon.svg favicon.ico apple-touch-icon.png site/
          if [ -f .htaccess ]; then cp .htaccess site/; fi
          echo "Файлы к выкладке:"; find site -type f | sort

      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Залить на Timeweb
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Папка сайта на хостинге, считая от входа по FTP
          REMOTE_DIR: public_html
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Не заданы FTP_HOST, FTP_USER или FTP_PASSWORD в Settings → Secrets and variables → Actions"; exit 1
          fi
          # Шифрование, если сервер его предлагает. Файлы на хостинге, которых нет в репозитории (например cgi-bin), не удаляются.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 site $REMOTE_DIR;
            bye"
